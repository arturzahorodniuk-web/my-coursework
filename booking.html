<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запис на прийом | Приватний лікар</title>
    
    <!-- Внутрішні стилі CSS для красивого дизайну -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* Світло-блакитний фон */
            color: #333;
        }
        header {
            background-color: #0056b3; /* Медичний синій колір */
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 15px 0 0 0;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #ffc107; /* Жовтий акцент при наведенні */
        }
        main {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-top: 0;
        }
        /* Стилізація форми */
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0056b3;
            outline: none;
        }
        button {
            margin-top: 25px;
            padding: 15px;
            background-color: #28a745; /* Зелена кнопка */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #343a40;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Шапка сайту (така ж як і на інших сторінках) -->
    <header>
        <h1>Медичний кабінет доктора Загороднюка</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="services.html">Послуги та ціни</a></li>
                <li><a href="booking.html">Запис на прийом</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Форма запису -->
    <main>
        <h2>Онлайн-запис на прийом</h2>
        <p style="text-align: center; color: #666;">Будь ласка, заповніть форму нижче, і наш адміністратор зв'яжеться з вами для підтвердження.</p>
        
        <form action="#" method="get">
            <label for="fullname">Прізвище, Ім'я, По батькові:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Іванов Іван Іванович" required>

            <label for="phone">Номер телефону:</label>
            <input type="tel" id="phone" name="phone" placeholder="+38 (099) 000-00-00" required>

            <label for="doctor">Оберіть спеціаліста:</label>
            <select id="doctor" name="doctor" required>
                <option value="" disabled selected>-- Оберіть лікаря --</option>
                <option value="therapist">Терапевт</option>
                <option value="cardiologist">Кардіолог</option>
                <option value="neurologist">Невролог</option>
            </select>

            <label for="date">Бажана дата прийому:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Бажаний час:</label>
            <input type="time" id="time" name="time" required>

            <label for="comments">Опишіть ваші симптоми (необов'язково):</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Коротко опишіть, що вас турбує..."></textarea>

            <button type="submit">Записатися на прийом</button>
        </form>
    </main>

    <!-- Підвал -->
    <footer>
        <p>&copy; 2026 Приватний медичний кабінет. Всі права захищені.</p>
    </footer>

</body>
</html>
